<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title>Samu Universe ConvAI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    body { margin: 0; background: #f8fafc; color:#0f172a; }
    .app { display: grid; grid-template-columns: 400px 1fr; min-height: 100vh; }

    /* Panel izquierdo: widget + captions */
    .left { background:#fff; border-right:1px solid #e2e8f0; padding:18px; display:flex; flex-direction:column; gap:14px; }
    .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px; }
    .pill { background:#eef2ff; color:#3730a3; border:1px solid #c7d2fe; padding:2px 8px; border-radius:999px; font-size:11px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .widget-shell { background:#fff; border:1px dashed #cbd5e1; border-radius:12px; padding:12px; }
    .captions { flex:1; display:flex; flex-direction:column; gap:6px; overflow-y:auto; max-height:calc(100vh - 380px); }
    .caption { padding:6px 10px; border-radius:8px; font-size:13px; border:1px solid #e5e7eb; background:#fff; }
    .caption .ts { font-size:10px; color:#94a3b8; margin-right:6px; }

    /* Panel derecho: chat de texto */
    .right { display:flex; flex-direction:column; padding:18px; gap:12px; }
    .right h2 { font-size:16px; display:flex; align-items:center; gap:8px; }
    .dot { width:9px; height:9px; border-radius:50%; background:#94a3b8; }
    .dot.on { background:#22c55e; }
    .dot.wait { background:#f59e0b; }
    .chat { flex:1; display:flex; flex-direction:column; gap:8px; overflow-y:auto; padding:4px; }
    .msg { max-width:80%; padding:10px 14px; border-radius:16px; font-size:14px; line-height:1.45; white-space:pre-wrap; }
    .msg.user { align-self:flex-end; background:#3b82f6; color:#fff; border-bottom-right-radius:4px; }
    .msg.agent { align-self:flex-start; background:#f1f5f9; border-bottom-left-radius:4px; }
    .msg.agent.streaming { border:1px dashed #3b82f6; }
    .msg.sys { align-self:center; color:#64748b; font-size:12px; }
    .input-row { display:flex; gap:8px; }
    .input-row input { flex:1; padding:11px 14px; border:1px solid #e2e8f0; border-radius:10px; font-size:14px; outline:none; }
    .input-row input:focus { border-color:#3b82f6; }
    .input-row input:disabled { background:#f1f5f9; }
    .btn { padding:10px 16px; border:none; border-radius:10px; cursor:pointer; font-size:13px; font-weight:600; }
    .btn:disabled { opacity:.45; cursor:not-allowed; }
    .btn.blue { background:#3b82f6; color:#fff; }
    .btn.green { background:#22c55e; color:#fff; }
    .btn.red { background:#ef4444; color:#fff; }
    .btns { display:flex; gap:8px; }

    @media(max-width:820px){ .app{grid-template-columns:1fr;grid-template-rows:auto 1fr} .left{max-height:48vh} }
  </style>
</head>
<body>
<div class="app">

  <!-- ====== VOZ + CAPTIONS ====== -->
  <div class="left">
    <h1 style="font-size:18px"><span class="mono">Samu Universe</span></h1>
    <div class="bar">
      <div>Sesion:</div><div id="sid" class="pill mono">—</div>
      <div id="status" class="pill">⏳ Esperando inicio…</div>
    </div>

    <div class="widget-shell">
      <elevenlabs-convai
        id="convai"
        agent-id="agent_9801ks7f666fft4b3bhbkqqc7cpe"
        override-language="es"
        dynamic-variables='{"session_id":"PENDING"}'>
      </elevenlabs-convai>
    </div>

    <h3 style="font-size:14px">Captions <span style="font-weight:400;font-size:11px;color:#94a3b8">(logMessage)</span></h3>
    <div id="captions" class="captions">
      <div class="caption" style="color:#94a3b8">Apareceran cuando el agente hable…</div>
    </div>
  </div>

  <!-- ====== CHAT DE TEXTO ====== -->
  <div class="right">
    <h2>Chat de texto <span id="dot" class="dot"></span> <span id="ws-label" style="font-size:12px;color:#94a3b8;font-weight:400">Desconectado</span></h2>

    <div id="chat" class="chat">
      <div class="msg sys">Presiona Conectar para iniciar una sesion de texto con SAMI</div>
    </div>

    <div class="input-row">
      <input id="txt" placeholder="Escribe un mensaje…" disabled autocomplete="off">
      <button id="btnSend" class="btn blue" disabled>Enviar</button>
    </div>
    <div class="btns">
      <button id="btnConn" class="btn green" onclick="wsConnect()">Conectar</button>
      <button id="btnDisc" class="btn red" onclick="wsDisconnect()" disabled>Desconectar</button>
    </div>
  </div>

</div>

<!-- Widget embed (CDN) -->
<script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

<script>
(function(){
  const AGENT_ID = 'agent_1501kc571zy4e3q84hcbj8v1ccks';
  const SID = crypto.randomUUID?.() || String(Math.random()).slice(2);
  const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ── Refs ──
  const widget    = document.getElementById('convai');
  const capsBox   = document.getElementById('captions');
  const chatBox   = document.getElementById('chat');
  const txtInput  = document.getElementById('txt');
  const btnSend   = document.getElementById('btnSend');
  const btnConn   = document.getElementById('btnConn');
  const btnDisc   = document.getElementById('btnDisc');
  const dotEl     = document.getElementById('dot');
  const wsLabelEl = document.getElementById('ws-label');

  // ================================================================
  // 1. CAPTIONS — logMessage client tool
  // ================================================================
  let firstCap = true;

  function addCaption(msg){
    if(firstCap){ capsBox.innerHTML=''; firstCap=false; }
    const d = document.createElement('div');
    d.className = 'caption';
    const t = new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    d.innerHTML = '<span class="ts">'+t+'</span>'+esc(msg);
    capsBox.appendChild(d);
    capsBox.scrollTop = capsBox.scrollHeight;
  }

  document.getElementById('sid').textContent = SID;
  widget?.setAttribute('dynamic-variables', JSON.stringify({session_id:SID}));

  widget?.addEventListener('elevenlabs-convai:call', ev => {
    document.getElementById('status').textContent = '✅ En llamada';
    addCaption('[Llamada iniciada]');
    try {
      const cfg = ev?.detail?.config;
      if(cfg){
        cfg.clientTools = {
          logMessage: async ({message}) => {
            addCaption(message || '(sin mensaje)');
            return {ok:true, receivedAt:new Date().toISOString()};
          }
        };
      }
    } catch(e){ console.error('clientTools error',e); }
  });

  widget?.addEventListener('elevenlabs-convai:end', ()=>{
    document.getElementById('status').textContent = 'ℹ️ Llamada finalizada';
    addCaption('[Llamada finalizada]');
  });

  // ================================================================
  // 2. CHAT DE TEXTO — WebSocket directo a ElevenLabs (sin backend)
  // ================================================================
  let ws = null;
  let streamEl = null;

  function setState(s){
    dotEl.className = 'dot'+(s==='on'?' on':s==='wait'?' wait':'');
    wsLabelEl.textContent = s==='on'?'Conectado':s==='wait'?'Conectando…':'Desconectado';
    const live = s==='on';
    txtInput.disabled = !live;
    btnSend.disabled  = !live;
    btnConn.disabled  = live||s==='wait';
    btnDisc.disabled  = !live;
  }

  function addMsg(role, text){
    const d = document.createElement('div');
    d.className = 'msg '+role;
    d.textContent = text;
    chatBox.appendChild(d);
    chatBox.scrollTop = chatBox.scrollHeight;
    return d;
  }

  window.wsConnect = function(){
    setState('wait');
    addMsg('sys','Conectando…');

    const url = 'wss://api.elevenlabs.io/v1/convai/conversation?agent_id='+AGENT_ID;
    ws = new WebSocket(url);

    ws.onopen = ()=>{
      ws.send(JSON.stringify({
        type:'conversation_initiation_client_data',
        conversation_config_override:{text_only:true},
        dynamic_variables:{session_id:SID},
        custom_llm_extra_body:{}
      }));
      setState('on');
      addMsg('sys','Sesion de texto iniciada. Escribe tu mensaje.');
    };

    ws.onmessage = e => handleMsg(JSON.parse(e.data));
    ws.onclose = ()=>{ setState(''); addMsg('sys','Sesion finalizada.'); ws=null; streamEl=null; };
    ws.onerror = ()=>{ setState(''); addMsg('sys','Error de conexion.'); };
  };

  window.wsDisconnect = function(){ if(ws) ws.close(); };

  function handleMsg(m){
    switch(m.type){
      case 'agent_response':
        if(streamEl){ streamEl.textContent=m.agent_response_event?.agent_response||''; streamEl.classList.remove('streaming'); streamEl=null; }
        else addMsg('agent', m.agent_response_event?.agent_response||'');
        break;

      case 'agent_chat_response_part':{
        const p = m.text_response_part||{};
        if(p.type==='start'){ streamEl=addMsg('agent',''); streamEl.classList.add('streaming'); }
        else if(p.type==='delta'&&streamEl){ streamEl.textContent+=p.text||''; chatBox.scrollTop=chatBox.scrollHeight; }
        else if(p.type==='stop'&&streamEl){ streamEl.classList.remove('streaming'); streamEl=null; }
        break;
      }

      case 'ping':
        ws?.send(JSON.stringify({type:'pong',event_id:m.ping_event?.event_id}));
        break;

      case 'user_transcript':
      case 'audio':
      case 'conversation_initiation_metadata':
        break;

      default:
        console.log('WS:',m.type,m);
    }
  }

  function send(){
    const t = txtInput.value.trim();
    if(!t||!ws||ws.readyState!==1) return;
    addMsg('user',t);
    ws.send(JSON.stringify({type:'user_message',text:t}));
    txtInput.value='';
    txtInput.focus();
  }

  btnSend.addEventListener('click', send);
  txtInput.addEventListener('keydown', e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();} });
})();
</script>
</body>
</html>
